# Builds the flashable images (boot.img + sheng-rootfs.sparse.img) on a
# native aarch64 runner. x86 runners would need QEMU, where a full SM8550
# kernel compile runs for many hours -- that is what this avoids.
#
# Two inputs, both manual: this repo publishes no releases, and the images
# contain proprietary Xiaomi/Qualcomm firmware with no redistribution grant
# (docs/README.md licensing warning). The repo is public, so workflow
# artifacts on a public repo are downloadable by anyone: keep upload=false
# unless the repo is private.
name: build-images

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload images as artifacts (redistribution-sensitive; repo is public)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    # actions: write is required by the purge step of the cache save; without
    # it the whole cache-save step fails instead of just skipping the purge.
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto

      # The kernel is source-patched (packages/kernel/default.nix) and in no
      # binary cache, so every cold run compiles it. The whole /nix store goes
      # into this repo's GitHub Actions cache -- private to the repo, unlike
      # public artifacts, so nothing leaks. Keyed on every nix file plus
      # flake.lock, with prefix restore so a one-file fix still reuses the
      # previous closure.
      - name: Restore nix store cache
        uses: nix-community/cache-nix-action/restore@v7
        id: nix-store-cache
        with:
          primary-key: nix-store-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/*.patch') }}
          restore-prefixes-first-match: nix-store-${{ runner.os }}-

      # Separate out-links: a plain `nix build .#u-boot` then `nix build .#nixos`
      # leaves a single `result` pointing at whichever built last -- the second
      # build silently replaces the first's symlink and boot.img disappears.
      - name: Build u-boot
        run: nix build .#u-boot -o result-boot --print-build-logs

      - name: Build rootfs image
        run: nix build .#nixos -o result-rootfs --print-build-logs

      - name: Collect images
        run: |
          mkdir -p out
          cp -L result-boot/boot.img out/
          cp -L result-rootfs/sheng-rootfs.sparse.img out/
          ls -la out/

      - name: Upload images
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: sheng-images
          path: out/
          retention-days: 7

      # Always save, including on failure: a failed kernel compile leaves no
      # output path, but everything that DID build (sources, stdenv, vendor
      # packages, u-boot) is store-closed and survives into the cache -- the
      # next run then only rebuilds what failed. Without always() a failed
      # build would cache nothing at all, which is exactly how the last two
      # cold runs each paid the full kernel compile for nothing.
      # gc-max-store-size + purge keep the repo under GitHub's 10 GB cache cap
      # by GC-ing to 7G and retaining only the newest cache version.
      - name: Save nix store cache
        if: always()
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-store-cache.outputs.primary-key }}
          gc-max-store-size-linux: 7G
          purge: true
          purge-prefixes: nix-store-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
